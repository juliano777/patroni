---
# async/poll 0: o etcd (Type=notify) só fica "pronto" com quorum, então o
# restart não pode bloquear até os outros nós subirem também.
- name: Restart etcd
  ansible.builtin.systemd:
    name: etcd
    state: restarted
    daemon_reload: true
  async: 300
  poll: 0

- name: Update CA certificates
  ansible.builtin.command: update-ca-certificates
  changed_when: true
