---
- name: Pacotes básicos
  ansible.builtin.apt:
    name:
      - ca-certificates
      - bash-completion
    update_cache: true
    cache_valid_time: 3600

- name: Entradas do cluster em /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} Patroni cluster"
    block: "{{ lookup('ansible.builtin.template', 'hosts.j2') }}"
